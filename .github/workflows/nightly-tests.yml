name: Nightly Playwright Tests

on:
  schedule:
    # Runs at 2 AM UTC every night (8 PM PST / 9 PM PDT)
    - cron: '0 2 * * *'
  # Allows manual triggering from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: playwright
      continue-on-error: true
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      run: npx playwright test specs/nightly/ specs/foxbox/ --reporter=html,json

    - name: Parse test results
      id: results
      if: always()
      run: |
        if [ -f results.json ]; then
          PASSED=$(jq '.stats.expected' results.json)
          FAILED=$(jq '.stats.unexpected' results.json)
          FLAKY=$(jq '.stats.flaky' results.json)
          DURATION_SECS=$(jq '(.stats.duration / 1000) | floor' results.json)
          MINS=$(( DURATION_SECS / 60 ))
          SECS=$(( DURATION_SECS % 60 ))
          SUMMARY="${PASSED} passed"
          [ "$FAILED" -gt 0 ] && SUMMARY="${SUMMARY} · ${FAILED} failed"
          [ "$FLAKY" -gt 0 ] && SUMMARY="${SUMMARY} · ${FLAKY} flaky"
          SUMMARY="${SUMMARY} | ⏱ ${MINS}m${SECS}s"
        else
          SUMMARY="results unavailable"
        fi
        echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

    - name: Upload test report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: always()

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: playwright-report/

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v4
      if: always()

    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "${{ steps.playwright.outcome == 'success' && '✅' || '❌' }} Nightly Tests (LMS + Foxbox) — ${{ steps.results.outputs.summary }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ steps.playwright.outcome == 'success' && '✅' || '❌' }} *Nightly Tests* — LMS + Foxbox\n${{ steps.results.outputs.summary }}\n<${{ steps.deploy.outputs.page_url }}|📊 View HTML Report>  ·  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Fail job if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1
